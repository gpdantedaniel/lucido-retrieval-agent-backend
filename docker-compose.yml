version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports: ["5432:5432"]

  langgraph-server:
    image: your-username/langgraph-server:latest  # Your pre-built image
    environment:
      
    ports: ["7860:7860"]
    depends_on:
      - redis
      - postgres

  nextjs-app:
    image: your-username/nextjs-app:latest  # Pre-built image
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_LANGGRAPH_API: "http://langgraph-server:7860"
    depends_on:
      - langgraph-server

  chromadb:
    image: chromadb/chroma:latest
    ports: ["8000:8000"]
    volumes:
      - chroma-data:/chroma/chroma_data
    environment:
      CHROMA_PERSIST_DIR: /chroma/chroma_data
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000

volumes:
  postgres-data:
  chroma-data: